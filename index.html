<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องติวสอบ · เลือกวิชา</title>
<link rel="stylesheet" href="shared/style.css">
<style>
.hero{margin:10px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card.empty{border-style:dashed;border-color:var(--line)}
.code{font-family:var(--mono);font-weight:600;font-size:1.35rem;letter-spacing:.02em}
.name{min-height:2.6em}
.name.missing{color:var(--graphite);font-style:italic}
.meta{font-size:.9rem;color:var(--graphite)}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:auto}
.feat a{font:inherit;font-size:.9rem;font-weight:600;text-align:center;border:1.5px solid var(--ink);border-radius:8px;padding:7px 4px;text-decoration:none;background:var(--paper)}
.feat a:hover{background:var(--soft)}
.card.empty .feat a{border-color:var(--line);color:var(--graphite)}
.open{align-self:flex-start}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>TutorHub · สอบวันที่ 24 กันยายน</h1>
    <p class="lead">เลือกวิชาที่จะติว แต่ละวิชามี 4 ส่วน: <b>ติวสอบ</b> · <b>ติวเนื้อหา</b> · <b>แบบฝึกหัด</b> · <b>เก็งข้อสอบ</b></p>
    <div class="sheet"><b>ตารางวันสอบ</b><div class="row"><span class="chip ready">09.00–11.00 · DTI286</span><span class="hint">พัก 2 ชั่วโมง</span><span class="chip ready">13.00–16.00 · PB287</span></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint" style="margin-top:22px">เนื้อหาในเว็บสรุปจากเอกสารของรายวิชาและแยกส่วน “เก็งข้อสอบ” ออกจากข้อมูลที่ยืนยันแล้วอย่างชัดเจน</p>
</div>
<script src="data/subjects.js"></script>
<script>
const g=document.getElementById('grid');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
g.innerHTML=(window.SUBJECTS||[]).map(s=>{
  const base=s.custom||`subject.html?s=${encodeURIComponent(s.id)}`;
  const t=s.tabs||{overview:'#overview',study:'#study',practice:'#practice',predict:'#predict'};
  const ready=s.status==='ready';
  return `<article class="card ${ready?'':'empty'}">
    <div class="row" style="margin:0;justify-content:space-between"><span class="code">${esc(s.code)}</span><span class="chip ${ready?'ready':'empty'}">${ready?'พร้อมติว':'รอเนื้อหา'}</span></div>
    <div class="name ${s.name?'':'missing'}">${s.name?esc(s.name):'ยังไม่ได้ใส่ชื่อวิชา'}</div>
    <div class="meta">สอบ: ${s.exam?esc(s.exam):'ยังไม่ระบุ'}</div>
    <a class="btn main open" href="${base}${t.overview}">เปิดวิชานี้</a>
    <nav class="feat" aria-label="ส่วนของ ${esc(s.code)}">
      <a href="${base}${t.overview}">ติวสอบ</a><a href="${base}${t.study}">ติวเนื้อหา</a><a href="${base}${t.practice}">แบบฝึกหัด</a><a href="${base}${t.predict}">เก็งข้อสอบ</a>
    </nav>
  </article>`}).join('');
</script>
</body>
</html>
